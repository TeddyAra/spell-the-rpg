<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Spell: The RPG · Map</title>
        <link rel="icon" type="image/x-icon" href="./imgs/favicon.ico">
        <link rel="stylesheet" href="./src/style.css">
        <link rel="stylesheet" href="./src/map/map.css">
    </head>

    <body class="panel-open">

        <!-- =====================================================
            MAP
        ===================================================== -->
        <div id="mapViewport">
            <div id="mapWorld">
                <!-- DM: the whole map. Players: only the revealed parts the DM sends them -->
                <div id="mapLayer"></div>
                <!-- DM: dims the squares players can't see -->
                <canvas id="fogCanvas" width="0" height="0"></canvas>
                <div id="gridOverlay"></div>
                <!-- The DM's drawings -->
                <svg id="drawLayer" width="1" height="1" aria-hidden="true"></svg>
                <!-- Doors (shown with the Doors button) -->
                <svg id="doorLayer" width="1" height="1"></svg>
                <div id="selectionBox" class="hidden"></div>
                <!-- DM: an eye button on each door -->
                <div id="doorHandles"></div>
                <div id="tokenLayer"></div>
                <svg id="rulerLayer" width="1" height="1" aria-hidden="true"></svg>
                <div id="rulerLabel" class="hidden"></div>
            </div>
        </div>

        <div id="roomBar" class="hidden">
            <span>Room <strong id="roomCode"></strong></span>
            <button id="copyRoomCode">Copy</button>
            <span id="roomStatus" data-kind="connecting"></span>
            <button id="leaveRoom">Leave</button>
        </div>

        <!-- =====================================================
            NOTES (see notes.js)
        ===================================================== -->
        <div id="sideButtons">
            <button id="myNotesButton" class="side-button" title="Notes" aria-label="Notes">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 3h9l4 4v14H6z" />
                    <path d="M15 3v4h4M9 11h7M9 15h7M9 19h4" />
                </svg>
            </button>

            <!-- DM only -->
            <button id="libraryButton" class="side-button hidden" title="Library: search your notes" aria-label="Library">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z" />
                </svg>
            </button>
        </div>

        <div id="librarySearch" class="hidden" role="dialog" aria-label="Search your notes">
            <input id="librarySearchInput" class="modal-input" type="search" placeholder="Search your notes…" spellcheck="false" autocomplete="off">

            <div id="libraryResults"></div>
            <p id="libraryEmpty" class="result-label hidden"></p>

            <footer id="libraryFooter">
                <span id="libraryCount" class="result-label"></span>
                <button id="loadLibraryButton" title="Load a Markdown notes file (or several)">Load notes file…</button>
                <input id="libraryFileInput" type="file" accept=".md,.markdown,.txt" multiple hidden>
            </footer>
        </div>

        <div id="mapControls">
            <button id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
            <button id="zoomOut" aria-label="Zoom out" title="Zoom out">−</button>
            <button id="toggleGrid" title="Show or hide the grid">Grid</button>
            <button id="toggleDoors" title="Show or hide where the doors are">Doors</button>
            <button data-tool="ruler" title="Measure distances (1 square = 5 ft)">Ruler</button>
            <button id="togglePanel" title="Show or hide the initiative list">Initiative</button>

            <!-- DM only -->
            <div id="dmTools" class="hidden">
                <button data-tool="reveal" title="Drag over squares to show them to the players">Reveal</button>
                <button data-tool="hide" title="Drag over squares to hide them again">Hide</button>
                <button data-tool="enemy" title="Click a square to place an enemy">Enemy</button>
                <button data-tool="draw" title="Draw lines everyone can see (the eraser is with the colours)">Draw</button>
                <button data-tool="door" title="Drag along the grid to add a door">Door</button>

                <div id="drawOptions" class="hidden">
                    <div id="colorSwatches"></div>
                    <button id="clearDrawings" title="Erase all drawings">Clear</button>
                </div>
            </div>

            <span id="mapHint" class="map-hint">Hold Shift to snap to the grid</span>
        </div>

        <!-- =====================================================
            INITIATIVE LIST
        ===================================================== -->
        <aside id="playersPanel" aria-label="Initiative">
            <div id="panelHeader">
                <h2>Initiative</h2>
                <button id="sortInitiative" class="hidden" title="Order by initiative, highest first">Sort</button>
            </div>

            <p id="playerListEmpty" class="result-label hidden">Nobody here yet.</p>

            <div id="playerList"></div>
        </aside>

        <!-- =====================================================
            LOBBY
        ===================================================== -->
        <div id="lobbyOverlay" class="overlay hidden">
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="lobbyTitle">
                <h2 id="lobbyTitle">Play together</h2>

                <hr class="roll-divider">

                <div class="modal-element">
                    <label for="playerNameInput">Your name</label>
                    <input class="modal-input" id="playerNameInput" type="text" maxlength="30" spellcheck="false">
                </div>

                <div class="button-pair">
                    <button id="hostButton" class="primary">Host as DM</button>
                    <button id="chooseMapButton" type="button">Choose map file</button>
                </div>

                <input id="mapFileInput" type="file" accept=".dd2vtt,.uvtt,.df2vtt" hidden>
                <button id="rehostButton" class="hidden"></button>

                <hr class="roll-divider">

                <form id="joinForm" autocomplete="off">
                    <label for="roomCodeInput">Room code</label>
                    <input class="modal-input" id="roomCodeInput" type="text" maxlength="10" spellcheck="false">
                    <button type="submit" class="primary">Join</button>
                </form>

                <p id="lobbyMessage" class="result-label"></p>
            </div>
        </div>

        <script type="module" src="./src/map/main.js"></script>
    </body>
</html>
